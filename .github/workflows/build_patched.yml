name: Build Patched APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Apply patch
        run: git apply rikkahub-plugins*.patch
      - name: Create dummy google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "dummy-project",
              "storage_bucket": "://appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuild000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuild000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-patched-apk
          path: app/build/outputs/apk/**/*.apk
